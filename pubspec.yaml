name: petlander_app
description: "Petlander - Track, Care And Love. Carnet de santé numérique pour animaux domestiques."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # ===== Backend & Auth =====
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0

  # ===== State management =====
  flutter_riverpod: ^2.5.1

  # ===== Navigation =====
  go_router: ^14.2.7

  # ===== UI / Design =====
  google_fonts: ^6.2.1
  font_awesome_flutter: ^10.7.0
  lottie: ^3.1.2
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  animate_do: ^3.3.4
  dotted_border: ^2.1.0
  percent_indicator: ^4.2.3

  # ===== Charts (suivi croissance) =====
  fl_chart: ^0.68.0

  # ===== Calendrier =====
  table_calendar: ^3.1.2

  # ===== Notifications locales =====
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # ===== Image / fichiers =====
  image_picker: ^1.1.2
  file_picker: ^8.1.2
  path_provider: ^2.1.4

  # ===== Sharing & PDF =====
  share_plus: ^10.0.2
  pdf: ^3.11.1
  printing: ^5.13.3
  flutter_pdfview: ^1.3.4

  # ===== Cache local (offline) =====
  shared_preferences: ^2.3.2
  sqflite: ^2.3.3+2

  # ===== Utilitaires =====
  intl: ^0.20.2
  uuid: ^4.4.2
  fluttertoast: ^8.2.8
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icons/

# ===== Configuration des icônes d'app (Android, iOS, Web) =====
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/icons/petlander_logo.png"
    background_color: "#FFFFFF"
    theme_color: "#9C27B0"
  image_path: "assets/icons/petlander_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/petlander_logo.png"
  remove_alpha_ios: true

# ===== Configuration du splash screen natif (Android, iOS, Web) =====
flutter_native_splash:
  color: "#9C27B0"
  image: "assets/icons/petlander_logo.png"
  android: true
  ios: true
  web: false
  android_12:
    image: "assets/icons/petlander_logo.png"
    color: "#9C27B0"
