workflows:
  android-release:
    name: Petlander — Android APK
    max_build_duration: 60
    environment:
      flutter: stable
      vars:
        SUPABASE_URL: $SUPABASE_URL
        SUPABASE_ANON_KEY: $SUPABASE_ANON_KEY
    scripts:
      - name: Créer le fichier .env
        script: |
          echo "SUPABASE_URL=$SUPABASE_URL" > petlander_app/.env
          echo "SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" >> petlander_app/.env
      - name: Obtenir les dépendances Flutter
        script: |
          cd petlander_app
          flutter pub get
      - name: Analyser le code
        script: |
          cd petlander_app
          flutter analyze
      - name: Construire l'APK release
        script: |
          cd petlander_app
          flutter build apk --release
    artifacts:
      - petlander_app/build/app/outputs/flutter-apk/app-release.apk
    publishing:
      email:
        recipients:
          - kaoutherzemouli@gmail.com
        notify:
          success: true
          failure: true
